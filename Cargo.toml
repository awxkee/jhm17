[workspace]
members = []
exclude = ["fuzz"]

[package]
name = "jhm17"
version = "0.1.0"
edition = "2024"
description = "JPEG encoder with rate-distortion optimized quantization"
readme = "README.md"
keywords = ["jpg", "jpeg", "encoder", "image"]
license = "BSD-3-Clause OR Apache-2.0"
authors = ["Radzivon Bartoshyk"]
documentation = "https://github.com/awxkee/jhm17"
categories = ["multimedia::images", "multimedia::encoding"]
repository = "https://github.com/awxkee/jhm17"
include = ["/src/", "/README.md", "/LICENSE.md", "/LICENSE-APACHE", "/LICENSE-MIT", "/LICENSE-IJG"]
rust-version = "1.94.0"

[features]
default = ["sse", "avx2", "neon"]
sse = []
avx2 = []
neon = []

[dev-dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features --no-deps --open --manifest-path ./Cargo.toml
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
